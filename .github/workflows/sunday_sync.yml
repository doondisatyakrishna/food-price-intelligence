name: Weekly Sunday Database Sync

on:
  schedule:
    # Runs every Sunday at 14:30 UTC (8:00 PM IST)
    - cron: '30 14 * * 0'
  # Lets you trigger a manual sync anytime from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run weekly sync, feature rebuild & model retrain
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python -m backend.sync
          python -m backend.features
          python -m backend.train

      - name: Checkpoint SQLite WAL journal into main .db file
        run: |
          python -c "import sqlite3; c = sqlite3.connect('data/food_price_intelligence.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE);'); c.close(); print('WAL checkpoint complete.')"

      - name: Commit updated database and retrained models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/food_price_intelligence.db models/
          if git diff --staged --quiet; then
            echo "No database or model changes; skipping commit."
          else
            git commit -m "Weekly AP sync & model retrain"
            git push
          fi