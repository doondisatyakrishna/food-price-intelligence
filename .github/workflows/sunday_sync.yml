name: Daily Database Sync & Sunday Model Retrain

on:
  schedule:
    # Runs daily at 02:00 UTC (7:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run daily sync, feature rebuild & Sunday model retrain
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python -m backend.sync
          python -m backend.features
          if [ "$(date +%u)" = "7" ]; then
            echo "Sunday detected — retraining 7d and 14d models..."
            python -m backend.train
          fi

      - name: Checkpoint SQLite WAL journal into main .db file
        run: |
          python -c "import sqlite3; c = sqlite3.connect('data/food_price_intelligence.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE);'); c.close(); print('WAL checkpoint complete.')"

      - name: Commit updated database and models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/food_price_intelligence.db models/
          git diff --staged --quiet || git commit -m "Daily AP & Telangana data sync"
          git push